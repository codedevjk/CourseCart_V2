<div class="admin-header mb-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Course Management</h1>
    <button class="btn btn-primary" (click)="openCreateModal()">+ New Course</button>
  </div>
</div>

<app-error-state *ngIf="error" [message]="error" (retry)="loadCourses()"></app-error-state>

<!-- Form Section -->
<div class="modal-overlay" *ngIf="showForm">
  <div class="admin-form-section modal-content">
    <h3 class="card-title">{{ isEditing ? 'Edit Course' : 'Create Course' }}</h3>
    <!-- TODO[TRAINEE]: Implement course creation and edit form (US 05) -->
  </div>
</div>

<app-loading-spinner *ngIf="isLoading" message="Loading courses..."></app-loading-spinner>

<div class="courses-list" *ngIf="!isLoading && courses.length > 0">
  <!-- TODO[TRAINEE]: Display list of admin courses with their status and actions (US 05, US 07) -->
</div>

<app-empty-state *ngIf="!isLoading && courses.length === 0 && !error" message="No courses found."></app-empty-state>

<!-- Confirmation Modal -->
<div class="modal-overlay" *ngIf="showConfirmModal">
  <div class="admin-form-section modal-content confirm-modal">
    <h3 class="card-title confirm-title">Confirm Action</h3>
    <p class="confirm-message">{{ confirmMessage }}</p>
    <div class="form-actions justify-content-center mt-4 confirm-actions">
      <button class="btn btn-outline" (click)="showConfirmModal = false">Cancel</button>
      <button class="btn btn-primary" (click)="executeConfirm()">OK</button>
    </div>
  </div>
</div>
